[package]
name = "rsmb-rs"
version = "0.1.0"
edition = "2021"
description = "ReelSmart-style motion blur for video: optical flow + shutter-angle controlled directional blur"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
indicatif = "0.17"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
